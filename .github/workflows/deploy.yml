name: Build, Push and Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t vertexcloud .

      - name: Tag Docker Image
        run: |
          docker tag vertexcloud:latest \
            387512138534.dkr.ecr.ap-south-1.amazonaws.com/vertexcloud:latest

      - name: Push Docker Image to ECR
        run: |
          docker push \
            387512138534.dkr.ecr.ap-south-1.amazonaws.com/vertexcloud:latest

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster vertexcloud_cluster \
            --service vertexcloud-service \
            --force-new-deployment

      - name: Wait for ECS Deployment
        run: |
          aws ecs wait services-stable \
            --cluster vertexcloud_cluster \
            --services vertexcloud-service

      - name: Deployment Completed
        run: |
          echo "ECR image pushed successfully."
          echo "ECS service redeployment completed successfully."
